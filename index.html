<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<title>客服對話時間格式轉換器</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  textarea { width: 100%; height: 300px; font-family: monospace; font-size: 14px; }
  button { margin: 10px 5px 10px 0; padding: 8px 15px; font-size: 16px; cursor: pointer; }
  #output { white-space: pre-wrap; background: #f0f0f0; padding: 15px; margin-top: 20px; border-radius: 6px; font-family: monospace; font-size: 14px; min-height: 150px; }

  /* 複製成功提示：頁面正中間 */
  #copyToast {
    visibility: hidden;
    min-width: 100px;
    background-color: #4CAF50;
    color: white;
    text-align: center;
    border-radius: 4px;
    padding: 10px 20px;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 16px;
    opacity: 0;
    transition: opacity 0.5s ease;
    z-index: 1000;
    box-shadow: 0 0 10px rgba(0,0,0,0.3);
  }
  #copyToast.show {
    visibility: visible;
    opacity: 1;
  }
</style>
</head>
<body>

<h2>客服對話時間格式轉換器</h2>

<label for="inputText">請貼上原始對話（格式: username>YYYY-MM-DD HH:mm : 訊息）:</label><br/>
<textarea id="inputText" placeholder="系统>2025-05-27 20:51 : 欢迎光临&#10;hong665580>2025-05-27 20:51 : 在吗&#10;荳荳>2025-05-27 20:53 : 亲亲您好..."></textarea><br/>

<button onclick="convert()">轉換時間格式</button>
<button onclick="clearInput()">清空輸入</button>

<h3>轉換結果</h3>
<div id="output"></div>
<button id="copyBtn" onclick="copyOutput()">複製輸出</button>

<!-- 複製成功提示 -->
<div id="copyToast">已複製</div>

<script>
function convert() {
  const input = document.getElementById('inputText').value.trim();
  if (!input) {
    alert("請輸入原始對話");
    return;
  }

  const lines = input.split('\n');
  let output = '';

  const lineRegex = /^(.+?)>(\d{4}-\d{2}-\d{2} \d{2}:\d{2})\s*:\s*(.+)$/;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    const match = line.match(lineRegex);
    if (!match) {
      output += line + '\n';
      continue;
    }

    const username = match[1];
    const datetimeStr = match[2];
    const message = match[3];

    const isoDatetime = datetimeStr.replace(' ', 'T');
    const dateObj = new Date(isoDatetime);

    if (isNaN(dateObj.getTime())) {
      output += line + '\n';
      continue;
    }

    const hh = String(dateObj.getHours()).padStart(2, '0');
    const mm = String(dateObj.getMinutes()).padStart(2, '0');
    const ss = '00';

    output += `[${hh}:${mm}:${ss}] ${username}: ${message}\n`;
  }

  document.getElementById('output').textContent = output;

  // 自動滾動到「複製輸出」按鈕位置
  const copyBtn = document.getElementById('copyBtn');
  copyBtn.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function clearInput() {
  document.getElementById('inputText').value = '';
  document.getElementById('output').textContent = '';
}

function copyOutput() {
  const output = document.getElementById('output').textContent;
  if (!output) {
    alert("目前沒有可複製的內容");
    return;
  }
  navigator.clipboard.writeText(output).then(() => {
    showCopyToast();
  }).catch(() => {
    alert("複製失敗，請手動複製");
  });
}

function showCopyToast() {
  const toast = document.getElementById('copyToast');
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}
</script>

</body>
</html>
