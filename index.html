<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>自動分行工具</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #ffc107;
      margin-bottom: 20px;
    }

    textarea, pre {
      width: 80%;
      max-width: 800px;
      height: 300px;
      background-color: #2e2e2e;
      color: white;
      border: 1px solid #444;
      padding: 10px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #ffc107;
      color: black;
      border: none;
      cursor: pointer;
      margin: 5px;
      border-radius: 5px;
    }

    #copyAlert {
      color: #4caf50;
      font-size: 14px;
      margin-top: 5px;
      display: none;
    }

    #copyAlert.show {
      display: block;
    }
  </style>
</head>
<body>
  <h1>自動分行工具</h1>

  <textarea id="inputText" placeholder="請貼上對話內容"></textarea>
  <button onclick="generateOutput()">生成換行</button>

  <pre id="outputText" onclick="selectAllText(this)">這裡會顯示換行後的對話</pre>
  <button onclick="copyOutput()">複製內容</button>
  <div id="copyAlert">已複製到剪貼簿！</div>

  <script>
    function isChinese(str) {
      return /^[\u4e00-\u9fa5]+$/.test(str);
    }

    function isEnglishNumber(str) {
      return /^[a-zA-Z0-9_]+$/.test(str);
    }

    function generateOutput() {
      const input = document.getElementById('inputText').value;
      const lines = input.split('\n');
      let output = '';
      let lastRole = '';

      lines.forEach((line) => {
        const match = line.match(/^\[\d{2}:\d{2}:\d{2}\]\s*(.+?):/);
        let role = '';

        if (match) {
          const name = match[1].trim();
          if (isEnglishNumber(name)) {
            role = 'USER';
          } else if (isChinese(name)) {
            role = 'AGENT';
          } else {
            role = 'USER';
          }
        } else {
          role = 'USER';
        }

        if (lastRole && role !== lastRole) {
          output += '\n';
        }

        output += line + '\n';
        lastRole = role;
      });

      document.getElementById('outputText').textContent = output;
      document.getElementById('outputText').scrollIntoView({ behavior: 'smooth' });
    }

    function copyOutput() {
      const outputText = document.getElementById('outputText');
      const range = document.createRange();
      range.selectNode(outputText);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      const alertBox = document.getElementById('copyAlert');
      alertBox.classList.add('show');
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 1000);
    }

    function selectAllText(element) {
      const range = document.createRange();
      range.selectNodeContents(element);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }

    document.getElementById('inputText').addEventListener('click', function() {
      this.select();
    });

    document.getElementById('outputText').addEventListener('click', function() {
      selectAllText(this);
    });
  </script>
</body>
</html>
