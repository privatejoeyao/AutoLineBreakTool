<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>自動換行工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 40px 0;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 80%;
      max-width: 800px;
      background-color: white;
      border-radius: 10px;
      padding: 30px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    textarea {
      width: 100%;
      height: 120px;
      font-size: 14px;
      padding: 10px;
      margin-bottom: 15px;
      resize: none;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    .button {
      background-color: #f0ad4e;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }
    .output {
      width: 100%;
      max-height: 400px;
      overflow-y: auto;
      background-color: #f9f9f9;
      border: 1px solid #ccc;
      border-radius: 5px;
      padding: 10px;
      white-space: pre-wrap;
      font-size: 14px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .copy-button {
      background-color: #5bc0de;
      border: none;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }
    #copyAlert {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #5cb85c;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 1000;
    }
    #copyAlert.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>自動換行工具</h2>
    <textarea id="inputText" placeholder="將對話內容貼上在這裡..." onclick="this.select()"></textarea>
    <button class="button" onclick="generateOutput()">生成</button>
    
    <div class="output" id="outputText" onclick="selectOutputText()"></div>
    <button class="copy-button" onclick="copyOutput()">複製</button>
  </div>

  <div id="copyAlert">✅ 複製成功！</div>

  <script>
    function getRole(line) {
      const match = line.match(/\[\d{2}:\d{2}:\d{2}\]\s*(.*?):/);
      if (match) {
        const name = match[1];
        // 如果名稱包含英文和數字，視為 USER；如果是簡體中文，視為 AGENT
        if (/^[A-Za-z0-9]+$/.test(name)) {
          return 'USER';
        } else {
          return 'AGENT';
        }
      }
      return 'USER'; // 無冒號或不規則格式，一律視為 USER
    }

    function generateOutput() {
      const input = document.getElementById('inputText').value;
      const lines = input.split('\n');
      let output = '';
      let lastRole = '';

      lines.forEach((line, index) => {
        if (line.trim() === '') return;

        const currentRole = getRole(line);

        if (lastRole && currentRole !== lastRole) {
          output += '\n'; // 插入整行空行
        }

        output += line + '\n';
        lastRole = currentRole;
      });

      document.getElementById('outputText').textContent = output;
      document.getElementById('outputText').scrollIntoView({ behavior: 'smooth' });
    }

    function copyOutput() {
      const outputText = document.getElementById('outputText');
      const range = document.createRange();
      range.selectNode(outputText);
      window.getSelection().removeAllRanges();
      window.getSelection().addRange(range);
      document.execCommand('copy');
      window.getSelection().removeAllRanges();
      const alertBox = document.getElementById('copyAlert');
      alertBox.classList.add('show');
      setTimeout(() => {
        alertBox.classList.remove('show');
      }, 1000);
    }

    function selectOutputText() {
      const output = document.getElementById('outputText');
      const range = document.createRange();
      range.selectNodeContents(output);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
    }
  </script>
</body>
</html>
